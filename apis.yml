aid: opentravel-alliance
url: https://raw.githubusercontent.com/api-evangelist/opentravel-alliance/refs/heads/main/apis.yml
name: OpenTravel Alliance
kind: company
description: >-
  The OpenTravel Alliance is a volunteer, non-profit travel technology standards body headquartered in
  Melbourne, Florida, United States. Since 1999 it has published the OpenTravel Specification — the OTA 1.0
  XML message suite (releases 2001A through 2024A) and the model-driven OpenTravel 2.0 Object Model (OTM),
  which generates XML Schema, JSON Schema and Swagger 2.0 resource contracts — plus the OpenTravel Code Lists
  used across air, hospitality, car rental, cruise, rail, GDS, channel and technology-provider systems.
  OpenTravel does not operate a booking service or sit in the distribution chain itself; it supplies the
  message vocabulary that suppliers, GDSs, channel managers and OTAs implement between each other, which
  makes it a switching-cost reducer rather than a switching-cost holder. Its API posture is honest but thin:
  there is no OpenTravel-operated runtime API and no public certification registry, though it does run a free
  self-serve developer portal — the OpenTravel Developers Network at opentraveldevelopersnetwork.com — and,
  as of 2026, an OAuth 2.1 protected Model Context Protocol server on opentravel.org.
  Specifications are royalty-free and free of charge, but the canonical download is behind a
  name/company/email lead-capture form with terms acceptance, and the OTM repository and member review
  periods are membership-gated ($950–$11,250/yr by revenue band). A public, unlicensed GitHub mirror at
  github.com/OpenTravel/OpenTravel-Specifications carries the bulk of the corpus — including eight Swagger 2.0
  resource contracts — and is the only ungated route to machine-readable artifacts. The organization has
  announced work with the Linux Foundation to form an Open Travel Foundation.
image: https://opentravel.org/wp-content/uploads/2025/08/opentravel-favicon2.png
