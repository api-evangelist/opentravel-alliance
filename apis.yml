- aid: opentravel-alliance:opentravel-2018a-hospitality-offers-resource
  name: OpenTravel 2018A Hospitality Offers Resource
  description: >-
    Swagger 2.0 resource contract generated from the OpenTravel 2.0 Object Model, 2018A Object Suite. Defines
    POST /HospitalityOffers and POST /HospitalityPropertyOffers with 372 model definitions covering hotel offer
    search and property-level offers. Specification artifact only — host 127.0.0.1, basePath /; the definitions
    variant of this file is Latin-1 encoded rather than UTF-8 as published upstream.
  humanURL: https://github.com/OpenTravel/OpenTravel-Specifications/tree/master/OTA2.0/OTA2.0_2018A_ObjectSuite
