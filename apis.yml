- aid: opentravel-alliance:opentravel-2020a-facility-resource
  name: OpenTravel 2020A Facility Resource
  description: >-
    Swagger 2.0 resource contract generated from the OpenTravel 2.0 Object Model, 2020A Object Suite. Defines
    POST /Facilities and GET /Facilities/{Identifier} with 232 model definitions covering hospitality and golf
    facility description. Published as a specification artifact with host example.com and basePath
    /resource/v1_0; OpenTravel operates no runtime endpoint for it.
  humanURL: https://github.com/OpenTravel/OpenTravel-Specifications/tree/master/OTA2.0/OTA2.0_2020A_ObjectSuite
