apis:
- aid: opentravel-alliance:opentravel-2020a-hotel-descriptive-content-resource
  name: OpenTravel 2020A Hotel Descriptive Content Resource
  description: >-
    Swagger 2.0 resource contract generated from the OpenTravel 2.0 Object Model, 2020A Object Suite. Defines
    three operations for hotel descriptive content — GET /HotelDescriptiveContents, POST
    /HotelDescriptiveContents/Query and POST /HotelDescriptiveContents/Notifications — with 337 model
    definitions. This is a specification artifact published by the standards body for implementers to host
    themselves; the document declares host 127.0.0.1 and basePath /v1_0 and OpenTravel operates no runtime
    endpoint for it.
  humanURL: https://github.com/OpenTravel/OpenTravel-Specifications/tree/master/OTA2.0/OTA2.0_2020A_ObjectSuite
