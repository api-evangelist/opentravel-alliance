name: OpenTravel Code Lists
note: The OpenTravel Code Lists are the enumerated vocabulary the OpenTravel message suites share — bed
  types, booking channels, distribution types, meeting-room formats, cuisine types and so on. The canonical
  distribution is a macro-enabled Excel workbook behind the lead-capture form at https://opentravel.org/download-code-list/,
  which is not machine readable. The MACHINE-READABLE form harvested here is the OTM `CodeList` library
  compiled to JSON Schema draft-04, published ungated in the public GitHub mirror. Every code list below
  was read out of those files verbatim; no term was invented. `EnumerationOpen` lists carry an `Other_`
  escape value and an `_Extension` sibling definition so implementers can add values; `EnumerationClosed`
  lists do not.
canonical_download: https://opentravel.org/download-code-list/
canonical_download_note: Excel (.xlsm) workbook, lead-capture form with terms acceptance; not machine
  readable.
change_request: https://opentravel.org/how-to-request-a-change-to-the-opentravel-alliance-codelist/
formats_published:
- JSON Schema draft-04 (OTM CodeList library)
- XML Schema (CodeList_*_Trim.xsd)
- Excel .xlsm / .xls workbook
- XML code table (OTA 1.0, through 2010B)
