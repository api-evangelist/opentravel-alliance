info:
  title: Opentravel Alliance Hotel Descriptive Contents API
  version: 1.0.0
  x-refined-note:
  - x-otm-library differs across the merged source definitions and was not carried
  description: 'Operations tagged HotelDescriptiveContents across 2 of this provider''s published API definitions: opentravel-2020a-hotel-descriptive-content-resource-defs-openapi.json, opentravel-2020a-hotel-descriptive-content-resource-openapi.json. Each path carries the servers of the definition it was published in.'
