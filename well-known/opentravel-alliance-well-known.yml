source: live probes of every apis.yml host on 2026-07-28
note: >-
  opentravel.org runs WordPress behind nginx on WP Engine. Unknown paths under the WordPress
  rewrite return HTTP 200 with the homepage (a soft 404), so a 200 alone is not evidence a
  document exists — every entry below was confirmed by content type and body. Paths served
  directly by nginx (llms.txt, security.txt) return a real nginx 404.
  The two OAuth documents are REAL: they are emitted by the WordPress MCP adapter running on
  the site and they advertise a hosted Model Context Protocol server at
  https://opentravel.org/wp-json/mcp/mcp-oauth-server. This was not present at the 2026-07-28
  first-round review, which recorded "/.well-known/ soft 404, no well-known documents".
