summary: >-
  OpenTravel publishes NO client SDK in any language package registry. There is no
  org.opentravel group on Maven Central (numFound 0), no npm result for "opentravel"
  (total 0), and no PyPI project named opentravel or opentravel-alliance (404). What it does
  ship first-party are TOOLING distributions attached to GitHub Releases in the OpenTravel
  org: the OTM model compiler / repository service, the DEx modelling application launchers,
  and an export utility. Everything a developer would call an "SDK" for OpenTravel messages
  is third-party (JiBX generated schema bindings, Liquid Technologies object models,
  community NuGet DTO packages) and is recorded as official:false.
