    DRAFT: [FacilityResource 1.0.0 (2020A), HospitalityContent 1.0.0 (2020A)]
    note: >-
      DRAFT libraries are published in the public mirror next to FINAL ones with no visible
      warning on the artifact. LibraryStatus is the only signal.
  docs: https://opentravel.org/about-2-0-object-model/
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  detail: >-
    No deprecation policy, no end-of-life schedule, no Sunset/Deprecation header contract
    (RFC 8594), and no operation in any of the eight Swagger documents carries
    `deprecated: true`. Old release suites are simply left in place. The de facto signal is
    supersession: the OTM-DE repository states "Maintenance Release ONLY, please use DEX from
    utilities", and the otm-dex repo is marked "MOVED to utilities".
  superseded_tooling:
  - {from: 'https://github.com/OpenTravel/OTM-DE', to: 'https://github.com/OpenTravel/OTM-DE-Utilities', signal: repo description}
  - {from: 'https://github.com/OpenTravel/otm-dex', to: 'https://github.com/OpenTravel/OTM-DE-Utilities', signal: repo description}
