  releases:
    ota_1_0: 2001A through 2024A (per the download form)
    ota_2_0: 2016A, 2017A, 2017B, 2018A, 2020A present in the public mirror; the download form lists 2016A through 2019A
  library_versions:
    detail: >-
      Each OTM library carries its own semver, surfaced in info.x-otm-library and in the schema
      filename — HospitalityFacility 1.0.0, HospitalityOffers 1.0.0, FacilityResource 1.0.0,
      HospitalityContent 1.0.0, Common 5.0.0, Organization 4.1.0, OrganizationHospitality 4.0.0.
  library_status:
